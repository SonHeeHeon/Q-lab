name: etf_rotation_us
description: >-
  US ETF GTAA 로테이션(듀얼 모멘텀) — SPY/QQQ/IWM/EFA/EEM/TLT/IEF/GLD/DBC/VNQ
  중 매월 12M/3M 모멘텀 상위 3개 보유. US 비용모델(매도세 없음) 자동 적용.
universe: ETF_US
rebalance_freq: MONTHLY
top_n: 3
start_date: 2016-07-01
end_date: 2026-06-09

factors: []

filters: []

groups:
  - name: Momentum
    weight: 1.0
    factors:
      - {factor: MOMENTUM_12M, higher_is_better: true}
      - {factor: MOMENTUM_3M, higher_is_better: true}

min_groups: 1
winsor_pct: 0.01
clip_z: 3.0
use_regime: false

# 기본판은 게이트 OFF. 절대 모멘텀 게이트(자기 12M 모멘텀<=0 자산군 미보유·현금 대체,
# 하락장 방어)는 abs_momentum_gate: true 로 켜서 직접 비교 실험할 수 있다.
# 튜닝된 개인 설정은 research/strategies/private/ (gitignore) 에 두면 이 파일을 덮는다.
abs_momentum_gate: false
abs_momentum_factor: MOMENTUM_12M
